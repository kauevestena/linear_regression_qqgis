name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from metadata.txt
        id: get_version
        run: |
          VERSION=$(python3 -c "
          import configparser
          config = configparser.ConfigParser()
          config.read('topoalign/metadata.txt')
          print(config.get('general', 'version').strip())
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Format tag (ensures 'v' prefix, e.g., v0.1.0)
          if [[ "$VERSION" =~ ^v ]]; then
            TAG="$VERSION"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "Release Tag: $TAG"

      - name: Check if release or tag already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping release creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Git tag $TAG already exists. Skipping release creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist. Creating new release."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Plugin Archive
        if: steps.check_release.outputs.exists == 'false'
        run: |
          # Package the QGIS plugin directory into standard zip archives
          zip -r topoalign.zip topoalign -x "topoalign/**/__pycache__/*" "topoalign/**/.pytest_cache/*" "topoalign/tests/*" "*.pyc"
          cp topoalign.zip "topoalign-${{ steps.get_version.outputs.version }}.zip"

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          files: |
            topoalign.zip
            topoalign-${{ steps.get_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
